name: Build & Deploy

on:
  push:
    branches: [main]

# Never overlap deployments; queued runs deploy the newest SHA only via latest checks
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sohalierum75-sys/persona-studio-api

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check production config
        run: |
          if [ -z "${{ vars.PUBLIC_BASE_URL }}" ]; then
            echo "::error::Repository variable PUBLIC_BASE_URL is not set (e.g. https://studio.example.com). The extension ZIP and client bundle must be built against the production API URL."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_BASE_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST"
          # Sync compose file + Caddyfile + deploy script into the dedicated
          # deploy directory (/opt/persona-studio) — other VPS services untouched.
          tar -C deploy -cf - compose.production.yaml Caddyfile deploy.sh \
            | $SSH "mkdir -p /opt/persona-studio/deploy && tar -C /opt/persona-studio/deploy -xf -"
          $SSH "IMAGE=${IMAGE} IMAGE_TAG=${IMAGE_TAG} bash -s" < deploy/deploy.sh
